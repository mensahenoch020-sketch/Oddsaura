name: Apply OddsAura X release
on:
  push:
    branches:
      - codex/x-one-tap-assistant
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d | git apply --index
          rm .github/workflows/apply-x-one-tap.yml
          git add -A
      - name: Verify release
        run: |
          npm ci
          npm run lint
          npm run build
          node --test tests/*.test.mjs
          npm run data:test
      - name: Commit verified release
        shell: bash
        run: |
          git config user.name "OddsAura Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: add one-tap X conversion assistant"
          git push

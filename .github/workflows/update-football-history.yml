name: Update historical football data

on:
  push:
    branches: [main]
    paths:
      - "pipeline/lib/football-data.mjs"
      - "pipeline/lib/identity.mjs"
      - "pipeline/lib/model.mjs"
      - "pipeline/lib/backtest.mjs"
      - "pipeline/update-history.mjs"
      - ".github/workflows/update-football-history.yml"
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-history
  cancel-in-progress: false

jobs:
  update-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh history and walk-forward backtest
        run: npm run data:history
        env:
          HISTORY_SEASONS: "6"
          BACKTEST_MATCHES: "800"
      - name: Commit changed history and performance
        run: |
          if git diff --quiet -- data/history data/public/model-performance.json; then
            echo "No historical data changes"
            exit 0
          fi
          git config user.name "OddsAura Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/history data/public/model-performance.json
          git commit -m "data: refresh historical football model"
          git push

name: Update football data

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/update-football-data.yml"
      - "package.json"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect, score and publish
        run: node pipeline/update.mjs
        env:
          HISTORY_DAYS: "10"
          ESPN_HISTORY_DAYS: "35"
          GLOBAL_HISTORY_DAYS: "14"
          FUTURE_DAYS: "7"
          ODDS_MATCH_LIMIT: "45"
      - name: Commit changed public snapshots
        run: |
          if git diff --quiet -- data/public; then
            echo "No public data changes"
            exit 0
          fi
          git config user.name "OddsAura Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/public
          git commit -m "data: refresh football snapshot"
          git push
